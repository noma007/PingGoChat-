<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>soichat - โปรไฟล์ของฉัน</title>
    <!-- 🟢 บายพาสระบบความปลอดภัยเครือข่ายเดิม ป้องกันการโดนล็อกหน้าจอ -->
    <meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval'; script-src * 'unsafe-inline' 'unsafe-eval'; connect-src * 'unsafe-inline' ws: wss:; img-src * data: blob:; style-src * 'unsafe-inline';">
    <script src="/socket.io/socket.io.js"></script>
    <style>
        /* จัดสไตล์ชีตโทนสีดำดาร์กโหมดถอดแบบความละเอียดตามรูปภาพจริง */
        body { background-color: #212121; margin: 0; padding: 20px; font-family: sans-serif; color: #ffffff; display: flex; flex-direction: column; align-items: center; height: 100vh; box-sizing: border-box; }
        .profile-container { width: 100%; max-width: 500px; text-align: center; margin-top: 20px; }
        .status-box { display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 12px; color: #10b981; margin-top: 6px; }
        .status-dot { width: 8px; height: 8px; background-color: #10b981; border-radius: 50%; display: inline-block; }
        .avatar-circle { width: 140px; height: 140px; background-color: #4b5563; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 72px; font-weight: bold; color: #ffffff; border: 4px solid #374151; box-shadow: 0 10px 15px rgba(0,0,0,0.3); margin: 24px auto; }
        .icon-row { display: flex; gap: 30px; justify-content: center; margin-bottom: 30px; }
        .icon-item { text-align: center; cursor: pointer; color: #888888; font-size: 11px; }
        .icon-emoji { font-size: 24px; margin-bottom: 4px; }
        .info-card { text-align: left; font-size: 14px; color: #cccccc; display: flex; flex-direction: column; gap: 14px; }
        .info-row-item { display: flex; justify-content: space-between; border-bottom: 1px solid #2d2d2d; padding-bottom: 8px; }
        .star-badge-row { display: flex; align-items: center; justify-content: space-between; background-color: #1a1a1a; padding: 10px; border-radius: 8px; }
        .vote-row { display: flex; justify-content: space-between; font-size: 13px; color: #888888; }
        .gold-stars { display: flex; justify-content: flex-end; gap: 6px; margin-top: 15px; font-size: 24px; color: #fbbf24; }
    </style>
</head>
<body>

    <div class="profile-container">
        <!-- ชื่อผู้ใช้ดึงค่าจากระบบคอม PC -->
        <h2 id="p-name" style="margin: 0; font-size: 22px; font-weight: normal;">Amorn</h2>
        <div class="status-box">
            <span class="status-dot"></span> <span>เมื่อกี้</span>
        </div>

        <!-- วงกลมรูปโปรไฟล์ใหญ่ตัวอักษรย่อตัว S -->
        <div class="avatar-circle">S</div>

        <!-- แผงปุ่มเมนูย่อยทั้ง 4 รายการใต้รูปโปรไฟล์ตามภาพจริง -->
        <div class="icon-row">
            <div class="icon-item"><div class="icon-emoji">🎁</div><div>ของขวัญ</div></div>
            <div class="icon-item"><div class="icon-emoji">🪙</div><div style="color:white;">0</div></div>
            <div class="icon-item"><div class="icon-emoji">📇</div><div>หมุดส่งต่อ</div></div>
            <div class="icon-item"><div class="icon-emoji">🎛️</div><div>สถานะ</div></div>
        </div>

        <!-- การ์ดประวัติข้อมูลประวัติส่วนตัว อายุ เพศ แถบดาวสีทอง -->
        <div class="info-card">
            <div class="info-row-item">
                <span>อายุ <strong style="color:white; font-weight:normal;">21</strong></span>
                <span style="color: #888888;">ชาย</span>
            </div>
            <div class="star-badge-row">
                <span style="color:#fbbf24;">⭐</span> <span style="color: #6b7280; cursor: pointer;">ⓘ</span>
            </div>
            <div class="vote-row"><span>คะแนนโหวตเดือนนี้</span><span style="color: #ffffff;">0</span></div>
            <div class="vote-row"><span>คะแนนโหวตรวม</span><span style="color: #ffffff;">0</span></div>
            
            <!-- สัญลักษณ์กลุ่มดาวห้าดวงสีทองด้านล่างสุดตามแบบ SoiChat -->
            <div class="gold-stars">
                <span>★</span><span>★</span><span>★</span><span>★</span><span>★</span>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        // เชื่อมต่อสัญญาณดึงชื่อจริงจากระบบเครือข่ายมาแสดงผลแบบอัตโนมัติ
        socket.on('connect', () => {
            console.log("🟢 หน้าโปรไฟล์ดาร์กโหมดเชื่อมต่อเซิร์ฟเวอร์ PC สำเร็จ");
        });
    </script>
</body>
</html>
