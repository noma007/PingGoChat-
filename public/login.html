<!DOCTYPE html>
<html lang="th" dir="ltr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>soichat - เข้าสู่ระบบ</title>
    <!-- 🟢 บายพาสระบบความปลอดภัย ป้องกันหน้าเว็บหลักสกัดสัญญาณ Socket -->
    <meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval'; script-src * 'unsafe-inline' 'unsafe-eval'; connect-src * 'unsafe-inline' ws: wss:; img-src * data: blob:; style-src * 'unsafe-inline';">
    <!-- เชื่อมต่อระบบเครือข่ายสัญญาณ Real-time สดตรงกับเซิร์ฟเวอร์ PC พอร์ต 3000 -->
    <script src="/socket.io/socket.io.js"></script>
    <style>
        /* จัดแต่งสไตล์ชีตโทนดาร์กโหมด (Dark Theme) ล็อกตำแหน่งคอมโพเนนต์ตามรูปภาพ SoiChat จริง */
        body { background-color: #1a1a1a; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; height: 100vh; display: flex; flex-direction: column; justify-content: flex-start; align-items: center; overflow-y: auto; color: #ffffff; }
        .modal-overlay { width: 100%; display: flex; flex-direction: column; align-items: center; padding-top: 40px; box-sizing: border-box; }
        .brand-title { font-size: 42px; font-weight: bold; color: #38bdf8; margin-bottom: 24px; text-shadow: 0 0 10px rgba(56, 189, 248, 0.3); text-align: center; }
        .login-box { max-width: 520px; width: 90%; background-color: #262626; border: 1px solid #333333; padding: 40px 32px; border-radius: 16px; box-shadow: 0 20px 25px rgba(0,0,0,0.4); box-sizing: border-box; }
        .form-header { display: flex; align-items: center; gap: 16px; margin-bottom: 24px; }
        .btn-back { cursor: pointer; font-size: 20px; color: #cccccc; }
        .form-title { margin: 0; font-size: 22px; color: #ffffff; font-weight: normal; }
        .passkey-btn { background-color: #1a1a1a; border: 1px solid #444444; border-radius: 12px; padding: 12px; display: flex; align-items: center; justify-content: center; gap: 12px; cursor: pointer; margin-bottom: 12px; }
        .sub-desc { color: #888888; font-size: 12px; text-align: center; margin: 0 0 20px 0; }
        .divider-box { display: flex; align-items: center; margin-bottom: 20px; }
        .divider-line { flex: 1; border: none; border-top: 1px solid #333333; }
        .divider-text { color: #888888; font-size: 13px; padding: 0 10px; }
        .input-group { margin-bottom: 16px; text-align: left; }
        .input-label { color: #888888; font-size: 12px; display: block; margin-bottom: 6px; }
        .input-field { width: 100%; background-color: #1a1a1a; border: 1px solid #444444; border-radius: 8px; color: #ffffff; padding: 12px; font-size: 15px; box-sizing: border-box; outline: none; }
        .input-field:focus { border-color: #38bdf8; }
        .password-wrapper { position: relative; }
        .eye-icon { position: absolute; right: 12px; bottom: 12px; cursor: pointer; color: #888888; font-size: 16px; }
        .forgot-link-box { text-align: right; margin-bottom: 24px; }
        .forgot-link { color: #cccccc; font-size: 13px; text-decoration: none; }
        .btn-blue-submit { width: 100%; background-color: #38bdf8; background-image: linear-gradient(to bottom, #38bdf8, #0284c7); color: white; font-size: 15px; font-weight: bold; border-radius: 24px; padding: 14px; border: none; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.2); margin-bottom: 24px; }
        .social-title { color: #888888; font-size: 13px; text-align: center; margin: 0 0 16px 0; }
        .social-row { display: flex; justify-content: center; gap: 12px; margin-bottom: 28px; }
        .social-circle { width: 44px; height: 44px; background-color: #1a1a1a; border: 1px solid #444; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-weight: bold; }
        .guest-title { color: #888888; font-size: 14px; text-align: center; margin: 0 0 6px 0; }
        .guest-link { color: #38bdf8; text-decoration: none; font-size: 14px; }
    </style>
</head>
<body>

    <div id="login-overlay" class="modal-overlay">
        <!-- 🩵 โลโก้แบรนด์สีฟ้าด้านบนสุด -->
        <div class="brand-title">soichat</div>

        <!-- ⬛ กล่องแบบฟอร์มเข้าสู่ระบบสีเทาเข้มทรงสี่เหลี่ยมตามภาพจริงของคุณ -->
        <div class="login-box">
            <div class="form-header">
                <span class="btn-back">←</span>
                <h2 class="form-title">เข้าสู่ระบบ</h2>
            </div>

            <!-- ปุ่มพาสคีย์ -->
            <div class="passkey-btn">
                <span style="font-size: 20px;">🔑</span>
                <span style="color: #ffffff; font-size: 15px;">เข้าสู่ระบบด้วยพาสคีย์</span>
            </div>
            <p class="sub-desc">ใช้พาสคีย์ที่คุณตั้งค่าไว้แล้ว</p>

            <div class="divider-box">
                <hr class="divider-line">
                <span class="divider-text">หรือใช้ชื่อล็อกอิน</span>
                <hr class="divider-line">
            </div>

            <!-- ช่องป้อนข้อมูลอินพุตหลัก (เปลี่ยนจากอีเมลเป็นช่องกรอกชื่อเล่นตามข้อตกลง) -->
            <div class="input-group">
                <label class="input-label">ชื่อผู้ใช้งาน / ชื่อเล่น</label>
                <!-- 🎯 ไอดีอินพุตสำหรับดึงค่าล็อกอิน -->
                <input type="text" id="login-username-input" class="input-field" placeholder="กรอกชื่อเล่นหรือชื่อล็อกอิน..." required>
            </div>

          <!-- ช่องกรอกรหัสผ่าน (ถอดแบบไอคอนลูกตาและรหัสตามภาพ) -->
            <div class="input-group password-wrapper">
                <label class="input-label">รหัสผ่าน</label>
                <input type="password" id="login-password" class="input-field" placeholder="••••••" required>
                <span class="eye-icon">👁️</span>
            </div>

            <div class="forgot-link-box">
                <a href="#" class="forgot-link">ลืมรหัสผ่าน</a>
            </div>

            <!-- ปุ่มกดยืนยันเข้าสู่ระบบสีฟ้ามนตัวใหญ่ตามภาพ -->
            <button id="btn-submit-login" class="btn-blue-submit">เข้าสู่ระบบ</button>

            <!-- แถวปุ่มไอคอนโซเชียลมีเดีย Line, Google, Facebook, X ด้านล่างสุดตามรูปภาพ -->
            <p class="social-title">หรือดำเนินการต่อด้วย</p>
            <div class="social-row">
                <div class="social-circle" style="color: #22c55e; font-size: 12px;">LINE</div>
                <div class="social-circle" style="color: #ea4335; font-size: 16px;">G</div>
                <div class="social-circle" style="color: #1877f2; font-size: 16px;">f</div>
                <div class="social-circle" style="color: #ffffff; font-size: 14px;">𝕏</div>
            </div>

            <p class="guest-title">เพิ่งมาซอยแชท?</p>
            <p style="margin: 0;"><a href="#" id="link-guest-mode" class="guest-link">ลองใช้โดยไม่ต้องสมัครสมาชิก</a></p>
        </div>
    </div>

    <!-- =========================================================================
         🎯 สคริปต์ควบคุมการส่งข้อมูลชื่อเล่นเข้าฐานข้อมูล PC และฟังก์ชันสลับเปลี่ยนหน้าจอ 
         ========================================================================= -->
    <script>
        const socket = io();

        const loginInput = document.getElementById('login-username-input');
        const btnSubmitLogin = document.getElementById('btn-submit-login');
        const linkGuestMode = document.getElementById('link-guest-mode');

        // ฟังก์ชันประมวลผลสัญญาณยิงล็อกอินเข้าฐานข้อมูลคอมพิวเตอร์ของคุณ
        function executeLogin() {
            const usernameText = loginInput.value.trim();
            
            if (!usernameText) {
                alert('กรุณากรอกชื่อผู้ใช้งานหรือชื่อเล่นของคุณก่อนเข้าซอยแชทครับ 😉');
                return;
            }

            // ตรวจเช็คสถานะการออนไลน์ของเซิร์ฟเวอร์หลังบ้าน
            if (!socket.connected) {
                alert('🔴 ระบบไม่ได้เชื่อมต่อกับเซิร์ฟเวอร์ PC กรุณาเปิดรันคำสั่ง node server.js ใน Terminal ก่อนครับ');
                return;
            }

            console.log(`📡 [PingGo] กำลังบันทึกชื่อ [ ${usernameText} ] ลงฐานข้อมูลเครื่อง PC ของคุณ...`);
            
            // 🚀 ยิงสัญญาณสดสมัครสมาชิก/ล็อกอินส่งตรงไปที่หลังบ้าน server.js
            socket.emit('register_and_login', { username: usernameText });
        }

        // ผูกสิทธิ์การคลิกที่ปุ่มสีฟ้า "เข้าสู่ระบบ"
        if (btnSubmitLogin) {
            btnSubmitLogin.addEventListener('click', executeLogin);
        }

        // ผูกสิทธิ์ให้สามารถกดปุ่ม Enter บนคีย์บอร์ดเพื่อล็อกอินได้เช่นกัน
        if (loginInput) {
            loginInput.addEventListener('keypress', (e) => { 
                if (e.key === 'Enter') executeLogin(); 
            });
        }

        // ผูกปุ่มลิงก์ลองใช้ไม่สมัครสมาชิกด้านล่างสุดให้สุ่มชื่อสุ่มไอดีอัตโนมัติ
        if (linkGuestMode) {
            linkGuestMode.addEventListener('click', (e) => {
                e.preventDefault();
                loginInput.value = 'User_' + Math.floor(Math.random() * 9000 + 1000);
                executeLogin();
            });
        }

        // 🎯 [จุดสำคัญที่สุด] เมื่อหลังบ้านบันทึกชื่อลง MongoDB Compass สำเร็จแล้ว ให้เด้งข้ามหน้าจอทันทีกวาดล้างปัญหาค้าง
        socket.on('login_success', (data) => {
            console.log("✅ ยืนยันคลังข้อมูล: สมัครสมาชิกลง PC สำเร็จแล้ว", data);
            
            // 🚀 สั่งเบราว์เซอร์ล้างกฎความปลอดภัยเดิม แล้วกระโดดสลับเปิดหน้าหลักด้านใน (/main) ทันที!
            window.location.href = '/main'; 
        });
    </script>
</body>
</html>
